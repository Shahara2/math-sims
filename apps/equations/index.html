<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>משוואה בנעלם אחד</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--card:#fff;--bd:rgba(0,0,0,.11);
  --blue:#185FA5;--blue-l:#E6F1FB;--blue-m:#378ADD;--blue-d:#0C447C;
  --green:#3B6D11;--green-l:#EAF3DE;
  --amber-l:#FAEEDA;--amber-d:#633806;
  --text:#2c2c2a;--muted:#6b6960;--hint:#9c9a92;
  --danger:#E24B4A;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1b18;--card:#252420;--bd:rgba(255,255,255,.11);
  --blue-l:#0d2a45;--green-l:#152810;--amber-l:#2a1e00;--amber-d:#FAC775;
  --text:#e8e6de;--muted:#b0aea6;--hint:#73726c;
}}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
.app{padding:.7rem;direction:rtl;max-width:820px;margin:0 auto}
.tabs{display:flex;gap:0;border-bottom:.5px solid var(--bd);margin-bottom:.8rem}
.tab{padding:6px 13px;border:none;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.tab.active{color:var(--blue);border-bottom-color:var(--blue-m);font-weight:500}
.panel{display:none}.panel.active{display:block}

/* progress */
.prog-wrap{margin-bottom:10px}
.prog-top{display:flex;justify-content:space-between;margin-bottom:4px}
.prog-lbl{font-size:12px;color:var(--muted)}
.prog-pct{font-size:12px;font-weight:500;color:var(--blue)}
.prog-track{height:5px;background:var(--bd);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--blue-m);border-radius:99px;transition:width .4s}
.prog-dots{display:flex;gap:5px;margin-top:5px}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--bd);cursor:pointer;transition:all .2s}
.pdot.curr{background:var(--blue-m)}.pdot.done{background:var(--green)}

/* layout */
.eq-layout{display:grid;grid-template-columns:1fr 230px;gap:10px;align-items:start}
@media(max-width:520px){.eq-layout{grid-template-columns:1fr}}

/* scale */
.scale-card{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:10px 10px 4px}
canvas#sc{width:100%;display:block}
.eq-display{text-align:center;font-size:20px;font-weight:500;margin:5px 0 2px;min-height:28px}
.eq-orig{text-align:center;font-size:12px;color:var(--hint);min-height:16px}
.anim-bar{text-align:center;font-size:11px;color:var(--muted);min-height:14px;margin:2px 0}

.card{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.clabel{font-size:10px;color:var(--hint);margin-bottom:6px;font-weight:500;letter-spacing:.05em;text-transform:uppercase}
.log-inner{max-height:110px;overflow-y:auto}
.log-row{font-size:12px;padding:3px 0;border-bottom:.5px solid var(--bd);display:flex;gap:8px}
.log-row:last-child{border-bottom:none}
.log-op{color:var(--muted);min-width:36px;font-size:11px;flex-shrink:0}
.log-eq{font-weight:500}
.solved-bar{padding:8px;border-radius:8px;background:var(--green-l);color:var(--green);border:.5px solid var(--green);text-align:center;font-size:14px;font-weight:500;margin-bottom:8px;display:none}
.solved-bar.show{display:block}

/* ─── CONTROLS redesign ─── */
.ctrl-section{background:var(--card);border:.5px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ctrl-header{font-size:10px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--hint);margin-bottom:8px}

/* operation row */
.op-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px}
.op-btn{padding:6px 4px;border-radius:6px;border:.5px solid var(--bd);background:var(--card);color:var(--text);font-size:13px;cursor:pointer;text-align:center;font-family:inherit;font-weight:500;transition:background .1s}
.op-btn:hover{background:var(--bg)}
.op-btn.sel{background:var(--blue-l);border-color:var(--blue-m);color:var(--blue-d)}

/* amount row: slider + value */
.amount-row{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.amount-row input[type=range]{flex:1;min-width:0}
.amount-display{font-size:15px;font-weight:500;min-width:26px;text-align:center;color:var(--blue)}

/* execute row */
.exec-row{display:flex;gap:6px;align-items:center}
.preview-pill{flex:1;height:34px;background:var(--bg);border:.5px solid var(--bd);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500;letter-spacing:.5px}
.exec-btn{height:34px;padding:0 16px;border-radius:8px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap}
.exec-btn:hover{background:var(--blue-d)}
.exec-btn:disabled{background:var(--bd);cursor:not-allowed}

/* hint toggle */
.hint-toggle-btn{width:100%;padding:6px;border-radius:6px;border:.5px solid var(--bd);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;margin-top:4px;transition:background .1s}
.hint-toggle-btn:hover{background:var(--bg)}
.hint-box{margin-top:6px;padding:7px 10px;border-radius:7px;background:var(--amber-l);color:var(--amber-d);font-size:12px;display:none;line-height:1.5}
.hint-box.show{display:block}

.err-msg{font-size:11px;color:var(--danger);min-height:13px;margin-top:3px}
.divider{height:.5px;background:var(--bd);margin:8px 0}
.nav-row{display:flex;gap:5px}
.sm-btn{height:30px;padding:0 10px;border-radius:6px;border:.5px solid var(--bd);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit}
.sm-btn:hover{background:var(--bg)}

/* exercises tab */
.eq-row{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;border:.5px solid var(--bd);margin-bottom:4px;font-size:13px;background:var(--card);cursor:pointer;transition:background .1s}
.eq-row:hover{background:var(--bg)}
.eq-row.curr{background:var(--blue-l);border-color:var(--blue-m)}
.eq-row.done{background:var(--green-l);border-color:var(--green)}
.eq-num{font-size:11px;color:var(--hint);min-width:16px}
.eq-txt{flex:1;font-weight:500}
.dot{width:7px;height:7px;border-radius:50%}
.dot-c{background:var(--blue-m)}.dot-d{background:var(--green)}.dot-t{background:var(--bd)}
.add-row{display:flex;gap:5px;margin-top:8px}
.add-inp{flex:1;height:30px;padding:0 8px;border:.5px solid var(--bd);border-radius:6px;font-size:12px;background:var(--card);color:var(--text);font-family:inherit}
</style>
</head>
<body>
<div class="app">
<div class="tabs">
  <button class="tab active" id="tab-btn-sim" onclick="switchTab('sim',this)">סימולציה</button>
  <button class="tab" id="tab-btn-ex" onclick="switchTab('ex',this)">תרגילים</button>
  <button class="tab" id="tab-btn-edit" onclick="switchTab('edit',this)">עריכה</button>
</div>

<div class="panel active" id="tab-sim">
  <div class="prog-wrap">
    <div class="prog-top"><span class="prog-lbl" id="prog-lbl">פתרת 0 מתוך 6</span><span class="prog-pct" id="prog-pct">0%</span></div>
    <div class="prog-track"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="prog-dots" id="prog-dots"></div>
  </div>

  <div class="eq-layout">
    <div>
      <div class="scale-card">
        <canvas id="sc" height="185"></canvas>
        <div class="eq-display" id="eq-disp"></div>
        <div class="eq-orig" id="eq-orig"></div>
        <div class="anim-bar" id="anim-bar" style="direction:ltr"></div>
      </div>
      <div class="card" style="margin-top:8px">
        <div class="clabel">יומן פתרון</div>
        <div class="log-inner" id="log-area"></div>
      </div>
      <div class="solved-bar" id="solved-bar"></div>
    </div>

    <div>
      <!-- NUMBERS SECTION -->
      <div class="ctrl-section">
        <div class="ctrl-header">פעולה על מספר</div>
        <div class="op-row">
          <button class="op-btn sel" id="n-add" onclick="selNumOp('add')">+ חיבור</button>
          <button class="op-btn" id="n-sub" onclick="selNumOp('sub')">− חיסור</button>
          <button class="op-btn" id="n-mul" onclick="selNumOp('mul')">· כפל</button>
          <button class="op-btn" id="n-div" onclick="selNumOp('div')">÷ חילוק</button>
        </div>
        <div class="amount-row">
          <input type="range" id="num-sl" min="1" max="10" step="1" value="1" oninput="syncNumSlider()"/>
          <span class="amount-display" id="num-disp">1</span>
        </div>
        <div class="exec-row">
          <div class="preview-pill" id="num-preview" style="direction:ltr;font-family:monospace">+1</div>
          <button class="exec-btn" id="num-exec-btn" onclick="doApplyNum()">בצע</button>
        </div>
        <div class="err-msg" id="num-err"></div>
      </div>

      <!-- X SECTION -->
      <div class="ctrl-section">
        <div class="ctrl-header">פעולה על הנעלם x</div>
        <div class="op-row" style="grid-template-columns:1fr 1fr">
          <button class="op-btn sel" id="x-add" onclick="selXOp('add')">+ הוסף x</button>
          <button class="op-btn" id="x-sub" onclick="selXOp('sub')">− הורד x</button>
        </div>
        <div class="amount-row">
          <input type="range" id="x-sl" min="1" max="9" step="1" value="1" oninput="syncXSlider()"/>
          <span class="amount-display" id="x-disp">1</span>
        </div>
        <div class="exec-row">
          <div class="preview-pill" id="x-preview" style="direction:ltr;font-family:monospace">+x</div>
          <button class="exec-btn" id="x-exec-btn" onclick="doApplyX()">בצע</button>
        </div>
      </div>

      <!-- HINT + NAV -->
      <div class="card">
        <button class="hint-toggle-btn" onclick="toggleHint()">💡 הצג הנחיה</button>
        <div class="hint-box" id="hint-box"></div>
        <div class="divider"></div>
        <div class="nav-row">
          <button class="sm-btn" onclick="resetCurr()">איפוס</button>
          <button class="sm-btn" onclick="nextEq()">הבא »</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="panel" id="tab-ex">
  <div class="card">
    <div class="clabel">תרגילים</div>
    <div id="eq-list"></div>
    <div class="add-row">
      <input class="add-inp" id="add-inp" placeholder="הוסף: 2x+3=9"/>
      <button class="sm-btn" onclick="addEq()">הוסף</button>
      <button class="sm-btn" onclick="resetAll()">איפוס</button>
    </div>
    <div class="err-msg" id="add-err"></div>
  </div>
</div>

<div class="panel" id="tab-edit">
  <div class="card">
    <div class="clabel">עריכת תרגילים</div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:8px">לחץ על תרגיל לעריכה ישירה · גרור לשינוי סדר</p>
    <div id="edit-list"></div>
    <div class="add-row" style="margin-top:10px">
      <input class="add-inp" id="edit-add-inp" placeholder="הוסף: 2x+3=9 · 2(x+1)=10 · x/2=5"/>
      <button class="sm-btn" onclick="addEqFromEdit()">הוסף</button>
    </div>
    <div class="err-msg" id="edit-err"></div>
    <div style="margin-top:8px;font-size:11px;color:var(--hint)">
      תמיכה: ax+b=c · a(x+b)=c · x/a+b=c
    </div>
    <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
      <button class="sm-btn" onclick="resetAllDone()">נקה סימוני פתרון</button>
      <button class="sm-btn" onclick="exportEqs()">📥 ייצוא JSON</button>
      <button class="sm-btn" onclick="importEqs()">📤 ייבוא JSON</button>
    </div>
    <div style="margin-top:8px;font-size:11px;color:var(--hint)">
      💾 השינויים נשמרים אוטומטית בדפדפן זה (localStorage).
      לגיבוי או שיתוף — ייצוא כקובץ JSON.
    </div>
  </div>
</div>

</div>

<script>
// ── PARSER ──────────────────────────────────────────────────────
function expandSide(t){
  t=t.replace(/([+-]?\d*\.?\d*)\(([^)]+)\)/g,(m,a,inner)=>{
    const A=a===''||a==='+'?1:a==='-'?-1:parseFloat(a)||1;
    const im=inner.match(/^([+-]?\d*\.?\d*)x([+-]\d+\.?\d*)?$/);
    if(!im)return m;
    const ix=im[1]===''||im[1]==='+'?1:im[1]==='-'?-1:parseFloat(im[1])||1;
    const ib=im[2]?parseFloat(im[2]):0;
    return(A*ix===1?'':A*ix===-1?'-':(A*ix))+'x'+(A*ib>=0&&ix?'+'+A*ib:A*ib);
  });
  t=t.replace(/([+-]?\d*\.?\d*)x\/(\d+\.?\d*)/g,(m,n,d)=>{
    const N=n===''||n==='+'?1:n==='-'?-1:parseFloat(n)||1;
    return(N/parseFloat(d)===1?'':N/parseFloat(d)===-1?'-':N/parseFloat(d))+'x';
  });
  let xc=0,nc=0;
  (t.match(/[+-]?\d*\.?\d*x/g)||[]).forEach(m=>{
    t=t.replace(m,'');const c=m.replace('x','');
    if(c===''||c==='+')xc+=1;else if(c==='-')xc-=1;else xc+=parseFloat(c)||0;
  });
  if(t!==''&&t!=='+'){const v=parseFloat(t);if(!isNaN(v))nc=v;}
  return{xc:Math.round(xc*1e6)/1e6,nc:Math.round(nc*1e6)/1e6};
}
function parseEqStr(raw){
  const s=raw.replace(/\s/g,''),pts=s.split('=');
  if(pts.length!==2)return null;
  const L=expandSide(pts[0]),R=expandSide(pts[1]);
  return{lx:L.xc,ln:L.nc,rx:R.xc,rn:R.nc};
}
function fmtD(xc,nc){
  const xr=Math.round(xc*1e6)/1e6,nr=Math.round(nc*1e6)/1e6;
  function tf(v){for(let d=2;d<=12;d++){const n=Math.round(v*d);if(Math.abs(n/d-v)<1e-8&&Math.abs(n)%d!==0)return n+'/'+d;}return null;}
  let xp='',np='';
  if(xr!==0){if(xr===1)xp='x';else if(xr===-1)xp='-x';else{const f=tf(xr);xp=(f||xr)+'x';}}
  if(nr!==0){const f=tf(nr),ns=f||nr;if(nr>0&&xr!==0)np='+'+ns;else np=''+ns;}
  return xp||np?xp+np:'0';
}
function fmtEq(s){return fmtD(s.lx,s.ln)+' = '+fmtD(s.rx,s.rn);}
function r3(v){return Math.round(v*1000)/1000;}

// ── STATE ───────────────────────────────────────────────────────
const RAWS=['2x=8','x+3=10','3x-1=8','4x+2=14','2(x+1)=10','x/2+1=5'];
let eqs=RAWS.map(raw=>{const p=parseEqStr(raw);return{raw,...p,done:false};});
let ci=0,st={lx:0,ln:0,rx:0,rn:0},log=[],busy=false,hintVisible=false;
let editMode=false;

// ── CONTROLS STATE ──────────────────────────────────────────────
let numOp='add',xOp='add';

function selNumOp(o){numOp=o;['add','sub','mul','div'].forEach(k=>document.getElementById('n-'+k).classList.toggle('sel',k===o));updPreviews();}
function selXOp(o){xOp=o;['add','sub'].forEach(k=>document.getElementById('x-'+k).classList.toggle('sel',k===o));updPreviews();}

function syncNumSlider(){
  const v=parseInt(document.getElementById('num-sl').value);
  document.getElementById('num-disp').textContent=v;
  updPreviews();
}
function syncXSlider(){
  const v=parseInt(document.getElementById('x-sl').value);
  document.getElementById('x-disp').textContent=v;
  updPreviews();
}

function updPreviews(){
  const nv=parseInt(document.getElementById('num-sl').value);
  const xv=parseInt(document.getElementById('x-sl').value);
  const nsym={add:'+',sub:'−',mul:'·',div:'÷'}[numOp];
  document.getElementById('num-preview').textContent=nsym+nv;
  const xsym=xOp==='add'?'+':'−';
  document.getElementById('x-preview').textContent=xv===1?xsym+'x':xsym+xv+'x';
}

// ── CANVAS ──────────────────────────────────────────────────────
const cv=document.getElementById('sc'),ctx=cv.getContext('2d');
let dpr=1,cw=400,ch=185;
function rz(){dpr=window.devicePixelRatio||1;cw=Math.max(200,cv.parentElement.clientWidth-20);cv.width=cw*dpr;cv.height=ch*dpr;ctx.scale(dpr,dpr);}
function getTilt(s, isImbalanced){
  // isImbalanced=true only during animation when op applied to ONE side only.
  // All other states (start, end of step) show balanced scale → tilt=0.
  if(!isImbalanced) return 0;
  // During imbalance: compare ln vs rn (constant terms) for visual effect
  const diff = s.ln - s.rn;
  // Also factor in x-coefficient difference for more realistic feel
  const xDiff = (s.lx - s.rx) * 2;
  return Math.max(-13, Math.min(13, (diff + xDiff) * 0.8));
}
function isSolved(){return st.lx===1&&Math.abs(st.ln)<1e-9&&Math.abs(st.rx)<1e-9;}

function drawScale(s,exL,exR){
  rz();ctx.clearRect(0,0,cw,ch);
  const dk=matchMedia('(prefers-color-scheme:dark)').matches;
  const C={beam:dk?'rgba(255,255,255,.22)':'rgba(0,0,0,.22)',piv:dk?'rgba(255,255,255,.45)':'rgba(0,0,0,.45)',
    lPan:dk?'#1a3a5c':'#E6F1FB',lTxt:dk?'#85B7EB':'#0C447C',
    rPan:dk?'#3d2800':'#FAEEDA',rTxt:dk?'#FAC775':'#633806',
    sPan:dk?'#1a3520':'#EAF3DE',sTxt:dk?'#9FE1CB':'#27500A',
    addW:'#C0DD97',addWt:'#27500A',subW:'#F7C1C1',subWt:'#791F1F'};
  const pivX=cw/2,pivY=76,arm=Math.min(cw*.38,165),chain=20,panW=Math.min(94,arm*.78),panH=34;
  const tilt=getTilt(s, !!(exL||exR)),rad=tilt*Math.PI/180;
  const lEx=pivX-arm*Math.cos(rad),lEy=pivY+arm*Math.sin(rad),rEx=pivX+arm*Math.cos(rad),rEy=pivY-arm*Math.sin(rad);
  ctx.fillStyle=C.beam;ctx.beginPath();ctx.roundRect(pivX-2.5,pivY,5,56,2);ctx.fill();
  ctx.beginPath();ctx.moveTo(pivX-24,pivY+56);ctx.lineTo(pivX-44,pivY+65);ctx.lineTo(pivX+44,pivY+65);ctx.lineTo(pivX+24,pivY+56);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.roundRect(pivX-52,pivY+65,104,7,3);ctx.fill();
  ctx.save();ctx.translate(pivX,pivY);ctx.rotate(-rad);ctx.fillStyle=C.beam;ctx.beginPath();ctx.roundRect(-arm,-2.5,arm*2,5,2.5);ctx.fill();ctx.restore();
  ctx.fillStyle=C.piv;ctx.beginPath();ctx.arc(pivX,pivY,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=dk?'#111':'#fff';ctx.beginPath();ctx.arc(pivX,pivY,2.5,0,Math.PI*2);ctx.fill();

  function pan(ex,ey,xc,nc,side,extra){
    ctx.strokeStyle=C.beam;ctx.lineWidth=1;ctx.setLineDash([2,3]);ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex,ey+chain);ctx.stroke();ctx.setLineDash([]);
    ctx.strokeStyle=C.beam;ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(ex-panW/2,ey+chain);ctx.lineTo(ex+panW/2,ey+chain);ctx.stroke();
    const py=ey+chain,sol=isSolved();
    const fc=sol?C.sPan:side==='l'?C.lPan:C.rPan,tc=sol?C.sTxt:side==='l'?C.lTxt:C.rTxt;
    const lbl=fmtD(xc,nc);
    ctx.fillStyle=fc;ctx.strokeStyle=tc+'55';ctx.lineWidth=0.7;ctx.beginPath();ctx.roundRect(ex-panW/2,py,panW,panH,4);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.roundRect(ex-5,py-5,10,7,3);ctx.fill();ctx.stroke();
    ctx.fillStyle=tc;const fs=Math.min(13,Math.max(9,panW/(Math.max(lbl.length,1))*1.5));ctx.font=`500 ${fs}px system-ui`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lbl,ex,py+panH/2);
    if(extra&&extra.alpha>0){
      const ewH=22,ewW=Math.min(58,panW*.58),ewY=py-ewH-10,fc2=extra.isAdd?C.addW:C.subW,tc2=extra.isAdd?C.addWt:C.subWt;
      ctx.globalAlpha=extra.alpha;ctx.fillStyle=fc2;ctx.strokeStyle=tc2+'55';ctx.lineWidth=0.7;ctx.beginPath();ctx.roundRect(ex-ewW/2,ewY,ewW,ewH,4);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.roundRect(ex-5,ewY-5,10,7,3);ctx.fill();ctx.stroke();
      ctx.fillStyle=tc2;ctx.font='500 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(extra.label,ex,ewY+ewH/2);ctx.globalAlpha=1;
    }
    ctx.fillStyle=dk?'rgba(255,255,255,.25)':'rgba(0,0,0,.25)';ctx.font='10px system-ui';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(side==='l'?'צד שמאל':'צד ימין',ex,ey+chain+panH+12);
  }
  pan(lEx,lEy,s.lx,s.ln,'l',exL);pan(rEx,rEy,s.rx,s.rn,'r',exR);
}

function animate(before,after,effOp,xc,nc,lbl,done){
  busy=true;['num-exec-btn','x-exec-btn'].forEach(id=>document.getElementById(id).disabled=true);
  const bar=document.getElementById('anim-bar');

  // midState = operation applied to LEFT side only → scale tilts
  const mid={
    lx:r3(effOp==='add'?before.lx+xc:effOp==='sub'?before.lx-xc:effOp==='mul'?before.lx*nc:before.lx/nc),
    ln:r3(effOp==='add'?before.ln+nc:effOp==='sub'?before.ln-nc:effOp==='mul'?before.ln*nc:before.ln/nc),
    rx:before.rx,
    rn:before.rn
  };

  const isAdd = effOp==='add' || (effOp==='mul' && nc>0) || (effOp==='div' && nc>0);
  const ei={label:lbl, isAdd};
  const verb=effOp==='add'?'מוסיפים':effOp==='sub'?'מחסירים':effOp==='mul'?'מכפילים':'מחלקים';

  // Phase 1: fade-in weight on LEFT pan (1.2s) → scale tilts
  bar.textContent=`שלב 1: ${verb} ${lbl} לצד שמאל — המאזניים הטו`;
  let a=0;
  const t1=setInterval(()=>{
    a=Math.min(1,a+0.07);
    drawScale(mid,{...ei,alpha:a},null);
    if(a>=1)clearInterval(t1);
  },40);

  setTimeout(()=>{
    clearInterval(t1);
    // hold the tilted state for a moment so user sees it
    drawScale(mid,{...ei,alpha:1},null);

    // Phase 2: fade-in weight on RIGHT pan (1.2s) → scale balances
    bar.textContent=`שלב 2: ${verb} ${lbl} גם לצד ימין — המאזניים מתאזנים`;
    let a2=0;
    const t2=setInterval(()=>{
      a2=Math.min(1,a2+0.07);
      drawScale(mid,{...ei,alpha:1},  // left weight stays visible
               {...ei,alpha:a2});     // right weight fades in
      if(a2>=1)clearInterval(t2);
    },40);

    setTimeout(()=>{
      clearInterval(t2);
      bar.textContent='';
      drawScale(after); // final balanced state, weights gone
      done();
    },1200);
  },1200);
}

// ── APPLY ACTIONS ───────────────────────────────────────────────
function applyToState(s,effOp,xc,nc){
  return{
    lx:r3(effOp==='add'?s.lx+xc:effOp==='sub'?s.lx-xc:effOp==='mul'?s.lx*nc:s.lx/nc),
    ln:r3(effOp==='add'?s.ln+nc:effOp==='sub'?s.ln-nc:effOp==='mul'?s.ln*nc:s.ln/nc),
    rx:r3(effOp==='add'?s.rx+xc:effOp==='sub'?s.rx-xc:effOp==='mul'?s.rx*nc:s.rx/nc),
    rn:r3(effOp==='add'?s.rn+nc:effOp==='sub'?s.rn-nc:effOp==='mul'?s.rn*nc:s.rn/nc),
  };
}

function finishApply(after,lbl){
  st=after;log.push({op:lbl,eq:fmtEq(st)});
  busy=false;['num-exec-btn','x-exec-btn'].forEach(id=>document.getElementById(id).disabled=false);
  if(isSolved()){eqs[ci].done=true;saveEqs();}
  render();
  if(window.self!==window.top)window.parent.postMessage({type:'STATE_CHANGED',solved:isSolved(),equation:eqs[ci].raw,steps:log.length},'*');
}

function doApplyNum(){
  if(busy)return;
  const err=document.getElementById('num-err');err.textContent='';
  const nc=parseInt(document.getElementById('num-sl').value);
  if((numOp==='div'||numOp==='mul')&&nc===0){err.textContent='ערך לא תקין';return;}
  const sym={add:'+',sub:'−',mul:'·',div:'÷'}[numOp];
  const lbl=sym+nc;
  const after=applyToState(st,numOp,0,nc);
  animate({...st},after,numOp,0,nc,lbl,()=>finishApply(after,lbl));
}

function doApplyX(){
  if(busy)return;
  const xv=parseInt(document.getElementById('x-sl').value);
  const effOp=xOp==='add'?'add':'sub';
  const lbl=(xOp==='add'?'+':'−')+(xv===1?'x':xv+'x');
  const after=applyToState(st,effOp,xv,0);
  animate({...st},after,effOp,xv,0,lbl,()=>finishApply(after,lbl));
}

// ── HINT ────────────────────────────────────────────────────────
function toggleHint(){
  hintVisible=!hintVisible;
  document.getElementById('hint-box').classList.toggle('show',hintVisible);
  document.querySelector('.hint-toggle-btn').textContent=hintVisible?'🙈 הסתר הנחיה':'💡 הצג הנחיה';
  if(hintVisible)updHint();
}
function updHint(){
  if(!hintVisible)return;
  const h=document.getElementById('hint-box');
  if(isSolved()){h.textContent='המשוואה נפתרה!';return;}
  if(st.ln!==0||st.rx!==0){
    if(st.ln>0)h.textContent=`יש להעביר אגפים: חסר ${st.ln} משני הצדדים.`;
    else if(st.ln<0)h.textContent=`יש להעביר אגפים: הוסף ${Math.abs(st.ln)} לשני הצדדים.`;
    else if(st.rx!==0)h.textContent=`יש להעביר אגפים: ${st.rx>0?'הסר':'הוסף'} x משני הצדדים.`;
  } else if(Math.abs(st.lx-1)>1e-9){
    h.textContent=`חלק את שני הצדדים ב-${st.lx} כדי לבודד את x.`;
  } else h.textContent='';
}

// ── RENDER ──────────────────────────────────────────────────────
function render(){
  drawScale(st);
  const d=document.getElementById('eq-disp');
  if(isSolved()){
    d.innerHTML=`<span style="color:var(--blue-d);background:var(--blue-l);border-radius:6px;padding:2px 14px">x = ${r3(st.rn)}</span>`;
  } else {
    // If only 1 log entry (התחלה), and raw has complex form, show raw
    const rawIsComplex = eqs[ci] && (eqs[ci].raw.includes('(') || eqs[ci].raw.includes('/'));
    if(log.length===1 && rawIsComplex) {
      d.innerHTML=`<span style="font-size:18px;font-weight:500">${eqs[ci].raw}</span>`;
    } else {
      d.textContent=fmtEq(st);
    }
  }
  const e=eqs[ci];
  // Always show original form; highlight if has brackets/fraction
const hasComplex = e && (e.raw.includes('(') || e.raw.includes('/'));
const origEl = document.getElementById('eq-orig');
if(hasComplex) {
  origEl.innerHTML = '<span style="color:var(--blue-d);font-weight:500">📌 ' + e.raw + '</span> <span style="color:var(--hint);font-size:10px">(יש לפשט תחילה)</span>';
} else {
  origEl.textContent = '';
}
  const la=document.getElementById('log-area');
  la.innerHTML=log.length?log.map(e=>`<div class="log-row"><span class="log-op">${e.op}</span><span class="log-eq">${e.eq}</span></div>`).join(''):'<div style="font-size:12px;color:var(--hint)">טרם בוצעו פעולות</div>';
  const lc=document.querySelector('.log-inner');if(lc)lc.scrollTop=lc.scrollHeight;
  const b=document.getElementById('solved-bar');
  if(isSolved()){b.textContent=`x = ${r3(st.rn)} — נפתרה!`;b.classList.add('show');}else b.classList.remove('show');
  updHint();
  renderProgress();renderList();updPreviews();
  if(document.getElementById('tab-edit').classList.contains('active'))renderEditList();
}

function renderProgress(){
  const total=eqs.length,done=eqs.filter(e=>e.done).length,pct=total?Math.round(done/total*100):0;
  document.getElementById('prog-lbl').textContent=`פתרת ${done} מתוך ${total}`;
  document.getElementById('prog-pct').textContent=pct+'%';
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-dots').innerHTML=eqs.map((e,i)=>`<div class="pdot ${i===ci?'curr':e.done?'done':''}" onclick="loadIdx(${i})" title="${e.raw}"></div>`).join('');
}
function renderList(){
  const ul=document.getElementById('eq-list');if(!ul)return;
  ul.innerHTML=eqs.map((e,i)=>`<div class="eq-row ${i===ci?'curr':e.done?'done':''}" onclick="loadIdx(${i});switchTabById('sim')"><span class="eq-num">${i+1}</span><span class="eq-txt">${e.raw}</span><span class="dot ${i===ci?'dot-c':e.done?'dot-d':'dot-t'}"></span></div>`).join('');
}
function loadIdx(i){
  if(!eqs[i])return;ci=i;const e=eqs[i];
  st={lx:e.lx,ln:e.ln,rx:e.rx||0,rn:e.rn};
  // For display: if raw has brackets/fractions, show raw form as first log entry
  const initDisplay = (e.raw.includes('(')||e.raw.includes('/')) ? e.raw : fmtEq(st);
  log=[{op:'התחלה',eq:initDisplay}];
  busy=false;hintVisible=false;
  ['num-exec-btn','x-exec-btn'].forEach(id=>document.getElementById(id).disabled=false);
  document.getElementById('num-err').textContent='';
  document.getElementById('anim-bar').textContent='';
  document.getElementById('solved-bar').classList.remove('show');
  document.getElementById('hint-box').classList.remove('show');
  document.querySelector('.hint-toggle-btn').textContent='💡 הצג הנחיה';
  render();
}
function resetCurr(){loadIdx(ci);}
function nextEq(){loadIdx((ci+1)%eqs.length);}
function resetAll(){eqs.forEach(e=>e.done=false);loadIdx(0);}
function addEq(){
  const inp=document.getElementById('add-inp'),err=document.getElementById('add-err'),raw=inp.value.trim();
  if(!raw)return;const p=parseEqStr(raw);
  if(!p){err.textContent='פורמט לא תקין';return;}
  err.textContent='';eqs.push({raw,...p,done:false});inp.value='';renderList();renderProgress();
}
function switchTab(id,btn){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('tab-'+id).classList.add('active');if(id==='sim')setTimeout(()=>{rz();drawScale(st);},20);if(id==='edit')renderEditList();}
function switchTabById(id){document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['sim','ex','edit'][i]===id));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById('tab-'+id).classList.add('active');}

function renderEditList(){
  const ul=document.getElementById('edit-list');if(!ul)return;
  ul.innerHTML=eqs.map((e,i)=>`
    <div style="display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;border:.5px solid var(--bd);margin-bottom:4px;background:var(--card)">
      <span style="font-size:11px;color:var(--hint);min-width:16px">${i+1}</span>
      <input style="flex:1;border:none;background:transparent;font-size:13px;font-weight:500;color:var(--text);font-family:inherit;outline:none"
        value="${e.raw}" 
        onchange="editEqAt(${i},this.value)"
        onblur="editEqAt(${i},this.value)"/>
      <span style="font-size:10px;padding:2px 7px;border-radius:99px;${e.done?'background:var(--green-l);color:var(--green)':'background:var(--bd);color:var(--hint)'}">${e.done?'✓ פתור':'ממתין'}</span>
      <button onclick="removeEq(${i})" style="width:22px;height:22px;border-radius:4px;border:.5px solid var(--bd);background:transparent;cursor:pointer;font-size:13px;color:var(--muted)">✕</button>
    </div>`).join('');
}

function editEqAt(i,raw){
  const p=parseEqStr(raw.trim());
  if(!p)return; // invalid — keep old
  eqs[i]={...eqs[i],raw:raw.trim(),...p};
  if(i===ci)loadIdx(ci); // reload if editing current
  saveEqs();renderProgress();renderList();renderEditList();
}

function removeEq(i){
  if(eqs.length<=1)return;
  eqs.splice(i,1);
  if(ci>=eqs.length)ci=eqs.length-1;
  loadIdx(ci);
  saveEqs();renderProgress();renderList();renderEditList();
}

function addEqFromEdit(){
  const inp=document.getElementById('edit-add-inp'),err=document.getElementById('edit-err');
  const raw=inp.value.trim();if(!raw)return;
  const p=parseEqStr(raw);
  if(!p){err.textContent='פורמט לא תקין';return;}
  err.textContent='';eqs.push({raw,...p,done:false});inp.value='';
  saveEqs();renderProgress();renderList();renderEditList();
}

function resetAllDone(){eqs.forEach(e=>e.done=false);saveEqs();renderProgress();renderList();renderEditList();}

if(window.self!==window.top){window.parent.postMessage({type:'READY'},'*');window.addEventListener('message',e=>{const m=e.data;if(!m?.type)return;if(m.type==='RESET')resetAll();if(m.type==='LOAD_EQ'&&m.raw){const p=parseEqStr(m.raw);if(p){eqs=[{raw:m.raw,...p,done:false}];loadIdx(0);}}});}

window.addEventListener('resize',()=>{rz();drawScale(st);});
// ── PERSISTENCE ─────────────────────────────────────────────────
const STORAGE_KEY = 'mathsim_equations_v1';

function saveEqs() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(eqs.map(e=>({raw:e.raw,done:e.done}))));
  } catch(e) {}
}

function loadEqsFromStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return false;
    const parsed = JSON.parse(saved);
    if (!Array.isArray(parsed) || parsed.length === 0) return false;
    const loaded = parsed.map(({raw, done}) => {
      const p = parseEqStr(raw);
      return p ? {raw, ...p, done: !!done} : null;
    }).filter(Boolean);
    if (loaded.length === 0) return false;
    eqs = loaded;
    return true;
  } catch(e) { return false; }
}

function exportEqs() {
  const data = JSON.stringify(eqs.map(e=>e.raw), null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'תרגילים.json'; a.click();
  URL.revokeObjectURL(url);
}

function importEqs() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,.txt';
  inp.onchange = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const raws = JSON.parse(ev.target.result);
        const loaded = (Array.isArray(raws) ? raws : [raws])
          .map(raw => { const p = parseEqStr(String(raw).trim()); return p ? {raw:String(raw).trim(),...p,done:false} : null; })
          .filter(Boolean);
        if (loaded.length === 0) { alert('לא נמצאו משוואות תקינות בקובץ'); return; }
        eqs = loaded; ci = 0; saveEqs();
        loadIdx(0); renderProgress(); renderList(); renderEditList();
        alert('יובאו ' + loaded.length + ' תרגילים בהצלחה');
      } catch(e) { alert('שגיאה בקריאת הקובץ'); }
    };
    reader.readAsText(file);
  };
  inp.click();
}

selNumOp('add'); selXOp('add');
loadEqsFromStorage();
loadIdx(0);
</script>
